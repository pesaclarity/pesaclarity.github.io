name: App screens

# Refreshes public/screens/ from the app's screenshots. The app's Screenshots
# workflow draws them from its own widgets with made-up records, puts them on
# a rolling pre-release (`screenshots` for dev, `screenshots-main` for main)
# and sends `screenshots-updated` here when a screen changed. This turns them
# into the site's WebP files (tool/app-screens.mjs): <name>.webp for light and
# <name>-dark.webp for dark mode. It opens or updates one pull request, only
# when the bytes changed.
on:
  repository_dispatch:
    types: [screenshots-updated]
  workflow_dispatch:
    inputs:
      tag:
        description: The app release to take the screens from
        type: choice
        options: [screenshots, screenshots-main]
        default: screenshots

permissions:
  contents: read

concurrency:
  group: app-screens
  cancel-in-progress: false

jobs:
  screens:
    name: Refresh the app screens
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Only the app's own screenshot releases are read, whatever the
      # dispatch says.
      - name: Download the app's screenshots
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.client_payload.tag || inputs.tag || 'screenshots' }}
        run: |
          case "$TAG" in
            screenshots | screenshots-main) ;;
            *) echo "::error::Unknown screenshots release: $TAG"; exit 1 ;;
          esac
          gh release download "$TAG" --repo pesaclarity/pesaclarity-app \
            --dir "$RUNNER_TEMP/app-screens" \
            --pattern manifest.json --pattern "*.png"

      - name: Make the WebP screens
        id: screens
        run: node tool/app-screens.mjs "$RUNNER_TEMP/app-screens"

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: content/app-screenshots
          add-paths: public/screens/*.webp
          commit-message: "content: app screenshots from ${{ steps.screens.outputs.commit }}"
          title: "content: app screenshots from ${{ steps.screens.outputs.commit }}"
          body: |
            The site's app screens, redrawn by the app's Screenshots workflow from pesaclarity-app at ${{ steps.screens.outputs.commit }} and converted by `tool/app-screens.mjs` (780 × 1688 WebP, `<name>.webp` light and `<name>-dark.webp` dark). ${{ steps.screens.outputs.changed }} files changed.

            Made-up records only. Check the images, and the alt text in `src/data/site.ts` if a screen now shows something different, before merging.
          delete-branch: true
